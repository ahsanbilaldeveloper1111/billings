version: "3.9"

services:
  billing-frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: billing-frontend:dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - billing_frontend_dev_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  billing_frontend_dev_node_modules:
